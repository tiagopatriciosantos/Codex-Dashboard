name: Apply and validate reviewed stabilization
on:
  push:
    branches: ['fix/stabilize-dashboard-zoom']
    paths: ['.github/stabilization.patch', '.github/workflows/apply-stabilization.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'tiagopatriciosantos/Codex-Dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stabilize-dashboard-zoom
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed patch to tracked source and lockfile
        run: |
          # Correct a context-only transcription; escalade itself is not updated.
          sed -i 's/"escalade": "\^1\.2\.0"/"escalade": "^3.2.0"/' .github/stabilization.patch
          git apply --check .github/stabilization.patch
          git apply --index .github/stabilization.patch
          git diff --cached --stat
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npm audit --json > audit-verified.json
      - uses: actions/upload-artifact@v4
        with:
          name: stabilization-preview
          retention-days: 3
          path: |
            dist/
            demo-overview.json
            audit-verified.json
      - name: Commit only reviewed source changes, then remove one-time apply workflow
        run: |
          git rm .github/stabilization.patch .github/workflows/apply-stabilization.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: apply tested source fixes and reviewed dependency lockfile'
          git push origin HEAD:fix/stabilize-dashboard-zoom
